[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/NandishSinha1403/delta"

# Lints shared by the engine crates (delta-core, delta-dsl opt in with `[lints] workspace = true`).
# The engine must never panic (docs/plan/08-ERRORS.md §1.6), so these are hard errors.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Small, fast WASM (docs/plan/03-ARCHITECTURE.md §4).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
