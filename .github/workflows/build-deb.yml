# Builds .deb packages of deltac with cargo-deb (called by release.yml through cargo-dist's
# global-artifacts-jobs). The binary inside is the static musl build, so it runs on any Debian or
# Ubuntu release; artifacts named artifacts-* are attached to the GitHub release.
name: Build .deb
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  deb:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl and cargo-deb
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo install cargo-deb --version 3.8.0 --locked
      - name: Build the package
        # A name without the version, so releases/latest/download/delta-lang-amd64.deb always works.
        run: |
          mkdir -p target/distrib
          cargo deb -p delta-cli --target ${{ matrix.target }} --output target/distrib/delta-lang-${{ matrix.arch }}.deb
      - name: Check it installs and runs
        run: |
          sudo dpkg -i target/distrib/*.deb
          deltac --version
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-deb-${{ matrix.arch }}
          path: target/distrib/*.deb
