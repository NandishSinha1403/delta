name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: pnpm/action-setup@v4             # reads "packageManager" from web/package.json
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm test
        working-directory: web
      # The front page and docs at /, the Pad at /pad/ (03-PRODUCTS.md §1).
      - run: ./scripts/build-site.sh
      # Cloudflare Pages, direct upload to the "delta" project; --branch=main makes it production.
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.42.0"             # the version the first deploys used
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=delta --branch=main
