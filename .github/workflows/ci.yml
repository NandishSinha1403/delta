# Checks from docs/plan/03-ARCHITECTURE.md §6.4 (the same list as CLAUDE.md).
name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript types are committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- web/src/engine/generated)" ]; then
            echo "::error::web/src/engine/generated is stale. Run 'cargo test' and commit the result."
            git status --short -- web/src/engine/generated
            git diff -- web/src/engine/generated
            exit 1
          fi
      - name: Generated docs are committed and up to date
        run: |
          cargo run -q -p delta-cli -- gen-docs site
          if [ -n "$(git status --porcelain -- site)" ]; then
            echo "::error::The generated docs are stale. Run 'cargo run -p delta-cli -- gen-docs site' and commit the result."
            git status --short -- site
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-wasm.sh
      - run: ./scripts/check-wasm-size.sh
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web
      - name: Build the site (front page, docs, Pad at /pad/) and test it
        run: ./scripts/build-site.sh
      - run: pnpm test:site
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, retention-days: 7 }
