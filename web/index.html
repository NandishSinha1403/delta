<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Delta: a programmable automata playground that follows Sipser's constructions." />
    <meta name="theme-color" content="#1f1f1f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Delta</title>
    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme).
      try {
        if (localStorage.getItem('delta.theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
